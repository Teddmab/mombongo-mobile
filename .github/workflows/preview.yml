name: Preview — EAS Build (APK)

on:
  push:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-preview:
    name: Build Android Preview APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (preview profile)
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait
        # --no-wait returns immediately; build status is visible at expo.dev/accounts/afrotouch-ou

      - name: Post build link
        run: |
          echo "## Preview Build Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Android APK build submitted to EAS. Track progress at:" >> $GITHUB_STEP_SUMMARY
          echo "https://expo.dev/accounts/afrotouch-ou/projects/mombongo/builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
